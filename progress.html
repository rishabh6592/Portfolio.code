<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under Maintenance</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 25px;
      font-size: clamp(1.6rem, 4vw, 3rem);
    }

    img {
      width: 100%;
      max-width: 800px;
      height: auto;
      border-radius: 12px;
      display: block;
    }

    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 24px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      text-decoration: none;
      padding-bottom: 2px;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s, opacity 0.2s;
    }

    .back-home:hover {
      border-bottom: 1px solid rgba(255, 255, 255, 0.6);
    }

    .back-home .arrow {
      transition: transform 0.2s;
    }

    .back-home:hover .arrow {
      transform: translateX(-3px);
    }

    /* Mobile */
    @media (max-width: 768px) {
      body {
        padding: 15px;
      }

      h1 {
        margin-bottom: 18px;
      }

      img {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>

  <h1>Add Some Features 🧑‍💻</h1>
  <img src="assets/images/WhatsApp Image.jpeg" alt="">
  <a class="back-home" href="./index.html"
    <span class="arrow">⬅️</span> Back to Home
  </a>
</body>
</html>
